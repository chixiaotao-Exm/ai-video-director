[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "avd"
version = "0.1.0"
description = "Stateful AI video director project state"
requires-python = ">=3.12"
dependencies = [
  "sqlalchemy>=2",
  "pydantic>=2",
  "pydantic-settings>=2",
  "httpx>=0.27",
]

[project.scripts]
avd = "avd.cli:main"

[project.optional-dependencies]
dev = [
  "pytest",
  "ruff>=0.9",
  "mypy>=1.14",
  "PyYAML>=6",
]
llm = [
  "anthropic>=0.40",
  "openai>=1.50",
  "google-genai>=1",
]
analysis = [
  "faster-whisper>=1",
  "scenedetect[opencv]>=0.6",
]
api = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "python-multipart>=0.0.9",
]
all = [
  "avd[llm,analysis,api]",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"avd.api" = ["static/*.html", "static/*.css", "static/*.js"]

[tool.pytest.ini_options]
addopts = "--basetemp=data/pytest"

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["data", ".venv"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.mypy]
python_version = "3.12"
files = ["src/avd"]
show_error_codes = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["avd.state.*", "avd.jobs.*", "avd.engine.*"]
strict = true

[[tool.mypy.overrides]]
module = ["anthropic.*", "openai.*", "google.*", "scenedetect.*", "faster_whisper.*"]
ignore_missing_imports = true
