[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "avd"
version = "0.1.0"
description = "Stateful AI video director project state"
requires-python = ">=3.12"
dependencies = [
  "sqlalchemy>=2",
  "pydantic>=2",
  "pydantic-settings>=2",
  "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
  "pytest",
]
llm = [
  "anthropic>=0.40",
  "openai>=1.50",
  "google-genai>=1",
]
analysis = [
  "faster-whisper>=1",
  "scenedetect[opencv]>=0.6",
]
api = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "python-multipart>=0.0.9",
]
all = [
  "avd[llm,analysis,api]",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "--basetemp=data/pytest"
