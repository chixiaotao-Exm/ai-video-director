name: Quality checks

on:
  push:
    branches: [main, master, "feat/**", "fix/**", "codex/**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      AVD_DATA_DIR: data/ci
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install media tools and fonts
        run: |
          sudo apt-get update
          sudo apt-get install --yes ffmpeg fonts-dejavu-core
      - name: Install application and test dependencies
        run: python -m pip install -e ".[dev,api,llm]"
      - name: Build Vue application
        run: |
          npm ci --prefix frontend
          npm run build --prefix frontend
          npm test --prefix frontend
          git diff --exit-code -- src/avd/api/static/studio
      - name: Lint and check types
        run: |
          python -m ruff check .
          python -m ruff format --check .
          python -m mypy
          python scripts/check_js.py
          bash -n deploy/gpu-server/setup.sh
      - name: Run offline tests
        run: python -m pytest -q
