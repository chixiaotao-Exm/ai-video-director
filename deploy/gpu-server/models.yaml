#     url: https://huggingface.co/OWNER/REPOSITORY/resolve/COMMIT/model.safetensors
#     target: diffusion_models
#     filename: model.safetensors
#     sha256: REPLACE_WITH_64_HEX_CHARACTERS_FROM_THE_PUBLISHER
models: []
